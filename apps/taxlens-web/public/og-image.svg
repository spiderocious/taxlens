<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="TaxLens NG — Nigeria tax calculator for the Nigeria Tax Act 2025">
  <!-- Paper background -->
  <rect width="1200" height="630" fill="#F6F4EF"/>
  <!-- Hairline frame to feel like a sheet on paper -->
  <rect x="40" y="40" width="1120" height="550" rx="22" fill="#FFFFFF" stroke="#E4E0D6" stroke-width="1"/>

  <!-- Brand row -->
  <g transform="translate(96,104)">
    <rect width="40" height="40" rx="10" fill="#C2613A"/>
    <text x="20" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#FBFAF7">₦</text>
    <text x="56" y="29" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#1C1B18">TaxLens</text>
    <text x="186" y="29" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#A8A49B">NG</text>
  </g>

  <!-- Eyebrow chip -->
  <g transform="translate(96,184)">
    <rect width="270" height="34" rx="17" fill="#FAF3EE" stroke="#E8C6B2"/>
    <circle cx="20" cy="17" r="4" fill="#C2613A"/>
    <text x="34" y="22" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#8E4022" letter-spacing="1">ESTIMATE · NTA 2025</text>
  </g>

  <!-- Headline (serif, two lines) -->
  <g font-family="Newsreader, Georgia, serif" fill="#1C1B18" font-weight="500">
    <text x="96" y="306" font-size="74" letter-spacing="-1.5">See what you actually pay</text>
    <text x="96" y="386" font-size="74" letter-spacing="-1.5">under the new tax law.</text>
  </g>

  <!-- Subline -->
  <text x="96" y="450" font-family="Newsreader, Georgia, serif" font-size="24" fill="#3A3833">
    Nigeria Tax Act 2025 calculator · Old-vs-new regime comparison · No account, nothing stored.
  </text>

  <!-- Footer URL -->
  <g transform="translate(96,538)">
    <text font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" font-weight="500" fill="#76726A">
      taxlens.ng
    </text>
    <text x="1006" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#76726A">
      ESTIMATE — NOT TAX ADVICE
    </text>
  </g>
</svg>
