    <!-- JSON-LD: FAQPage — mirrors the FAQ on the page itself -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "When does the Nigeria Tax Act 2025 take effect?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The Nigeria Tax Act 2025 takes effect on 1 January 2026. Personal income tax for the 2026 tax year is computed under its new bands and reliefs."
            }
          },
          {
            "@type": "Question",
            "name": "What changed under the Nigeria Tax Act 2025?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The first ₦800,000 of taxable income is tax-free, the bands above it are progressive from 15% to 25%, and the old Consolidated Relief Allowance is replaced by a rent relief of 20% of rent paid, capped at ₦500,000. Statutory deductions for pension, NHIS, NHF and life insurance still apply."
            }
          },
          {
            "@type": "Question",
            "name": "Is TaxLens free? Do I need an account?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "TaxLens is free, requires no account and stores no personal data. Your figures are used once to compute an estimate and then discarded."
            }
          },
          {
            "@type": "Question",
            "name": "Is the TaxLens estimate tax advice?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Every figure is an estimate under the Nigeria Tax Act 2025 and is not tax advice. For complex situations, please consult a registered tax professional."
            }
          },
          {
            "@type": "Question",
            "name": "Can I compute my tax from a bank statement?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Upload a Nigerian bank statement PDF (3–12 months); TaxLens reads the credits, classifies them as salary, business or transfer, and lets you confirm which count as income before computing your position under the NTA 2025."
            }
          }
        ]
      }
    </script>
